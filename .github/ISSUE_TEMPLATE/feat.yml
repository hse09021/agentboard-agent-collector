name: feat — 기능 제안
description: "새로운 기능이나 개선을 제안합니다 — 브랜치: feat/"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: |
        지금 무엇이 어렵거나 불가능한가요? 해결책이 아니라 상황을 적어 주세요 —
        그래야 더 나은 방법을 함께 찾을 여지가 남습니다.
      placeholder: |
        여러 대의 작업 컴퓨터에서 같은 계정을 쓰는데, 대시보드에서 어느 기기의
        사용량인지 구분할 수 없습니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 생각하고 계신 방향. 대략적이어도 괜찮습니다.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - CLI 명령 (login, logout, status, doctor)
        - 훅 설치 (install-hooks, uninstall-hooks)
        - Claude Code 훅 (plugin/hooks/claude)
        - Codex 훅 (plugin/hooks/codex)
        - 훅 공용 라이브러리 (plugin/hooks/lib — 전송, 사용량 한도)
        - 이벤트 전송 / API 클라이언트 (src/api)
        - 설정·자격증명 저장 (src/core, src/platform)
        - 프라이버시 가드 (forbidden-data-guard)
        - 문서 (README, 설치 안내)
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: 관련된 AI 도구
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - 양쪽 공통
        - 해당 없음
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 함께 고려했다가 접어둔 방법과, 그 이유.

  - type: checkboxes
    id: constraints
    attributes:
      label: 아래에 해당하는 것이 있나요
      description: |
        수집기는 프라이버시 우선 원칙을 따릅니다 — 프롬프트, 코드, 파일 경로,
        저장소 내용을 절대 수집하지 않습니다. 이를 필요로 하는 제안은 받을 수 없습니다.
      options:
        - label: 사용량 이벤트에 새 필드가 필요함 (서버 스키마도 함께 바뀜)
        - label: 훅이 수집하는 데이터의 범위가 바뀜
        - label: CLI 명령이나 옵션의 이름·동작이 바뀜
        - label: 이미 설치된 사용자의 훅 재설치가 필요함
        - label: 대시보드(ai-cost-dashboard) 쪽 변경이 함께 필요함

  - type: input
    id: branch-slug
    attributes:
      label: 브랜치 슬러그 (영문)
      description: |
        `ready` 라벨을 붙이면 이 값으로 작업 브랜치가 만들어집니다.
        영문 소문자·숫자·하이픈만 쓰세요. 짧을수록 좋습니다 (2~4 단어).
        비워 두면 이슈 번호만으로 만들어집니다 — 예: `feat/42`
      placeholder: "per-device-labels"
