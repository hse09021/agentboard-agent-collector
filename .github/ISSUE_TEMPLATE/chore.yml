name: chore — 유지보수 작업
description: "의존성, 릴리스, 배포 등 계획된 작업 — 브랜치: chore/"
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        이미 하기로 정해져 추적만 필요한 작업에 씁니다 — 의존성 업데이트,
        npm 릴리스, 문서 정리 등.

        새로운 것을 제안하려면 **feat**, 버그는 **fix**, 동작을 바꾸지 않는
        구조 개선은 **refactor**를 사용하세요.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업으로 무엇을 달성하며, 왜 할 만한지.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: |
        무엇이 포함되고 무엇이 빠지는지. 빠지는 것을 명시해 두면 작업이
        진행되며 범위가 불어나는 것을 막을 수 있습니다.
      value: |
        **포함**
        -

        **제외**
        -
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 단계
      description: 작업을 쪼개 두고 진행하며 체크하세요.
      value: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇을 보고 끝났다고 판단할지.
      value: |
        - [ ] `npm run lint` 통과
        - [ ] `npm run test` 통과
        - [ ]
    validations:
      required: true

  - type: checkboxes
    id: release
    attributes:
      label: 릴리스 관련
      description: npm에 새 버전을 배포하는 작업이라면 체크해 주세요.
      options:
        - label: package.json 버전을 올림
        - label: npm에 배포함 (`npm publish`)
        - label: 사용자가 `install-hooks --force` 로 훅을 다시 깔아야 함
        - label: 대시보드(ai-cost-dashboard) 쪽 배포가 함께 필요함

  - type: textarea
    id: rollback
    attributes:
      label: 롤백 계획
      description: |
        npm 배포나 훅 형식을 건드리는 작업이라면 필수입니다.
        이미 설치한 사용자에게 문제가 생기면 어떻게 되돌리나요?

  - type: input
    id: depends
    attributes:
      label: 선행 작업
      description: 먼저 머지되어야 하는 이슈나 PR.
      placeholder: "#12, #15"

  - type: input
    id: branch-slug
    attributes:
      label: 브랜치 슬러그 (영문)
      description: |
        `ready` 라벨을 붙이면 이 값으로 작업 브랜치가 만들어집니다.
        영문 소문자·숫자·하이픈만 쓰세요. 짧을수록 좋습니다 (2~4 단어).
        비워 두면 이슈 번호만으로 만들어집니다 — 예: `chore/42`
      placeholder: "bump-vitest-4"
