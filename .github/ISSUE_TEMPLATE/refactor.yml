name: refactor — 구조 개선
description: "동작은 그대로 두고 구조를 개선합니다 — 브랜치: refactor/"
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        리팩터링은 코드의 구성 방식을 바꾸는 것이지, 하는 일을 바꾸는 것이 아닙니다.
        겉으로 드러나는 동작이 달라져야 한다면 **feat** 또는 **fix**입니다.

  - type: textarea
    id: current
    attributes:
      label: 현재 구조
      description: 지금 코드가 어떤 상태이고, 무엇이 문제인지.
      placeholder: |
        Claude 훅과 Codex 훅이 stdin 파싱과 전송 로직을 각각 복제하고 있습니다.
        전송 재시도 정책을 바꾸려면 두 곳을 모두 고쳐야 합니다.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 목표 구조
      description: 작업 후에 어떤 모습이어야 하는지.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - CLI 명령 (src/cli)
        - Claude Code 훅 (plugin/hooks/claude)
        - Codex 훅 (plugin/hooks/codex)
        - 훅 공용 라이브러리 (plugin/hooks/lib)
        - 이벤트 전송 / API 클라이언트 (src/api)
        - 코어 로직 (src/core)
        - 플랫폼 계층 (src/platform)
        - 테스트 구조
        - 빌드·타입 설정 (tsconfig, vitest)
        - 여러 영역에 걸침
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 동작이 그대로임을 어떻게 확인하나요
      description: |
        리팩터링의 핵심 질문입니다. 어떤 테스트로, 어떤 명령을 비교해서,
        또는 어떤 수동 확인으로 검증할지 적어 주세요.
      value: |
        - [ ] 기존 테스트가 수정 없이 통과
        - [ ] 실제 세션을 돌려 대시보드에 동일하게 반영되는 것을 확인
        - [ ]
    validations:
      required: true

  - type: checkboxes
    id: risk
    attributes:
      label: 아래를 건드리나요
      options:
        - label: 서버로 보내는 이벤트의 형식 (필드명, 타입)
        - label: 훅 스크립트의 파일 경로나 이름 — 기존 설치본이 이 경로를 참조함
        - label: 설정 파일이나 자격증명 저장 위치·형식
        - label: CLI 명령·옵션의 이름이나 출력 형식
        - label: 금지 데이터 가드 등 프라이버시 관련 코드
        - label: 이미 배포된 버전과의 호환성

  - type: input
    id: depends
    attributes:
      label: 선행 작업
      description: 먼저 머지되어야 하는 이슈나 PR.
      placeholder: "#12, #15"

  - type: input
    id: branch-slug
    attributes:
      label: 브랜치 슬러그 (영문)
      description: |
        `ready` 라벨을 붙이면 이 값으로 작업 브랜치가 만들어집니다.
        영문 소문자·숫자·하이픈만 쓰세요. 짧을수록 좋습니다 (2~4 단어).
        비워 두면 이슈 번호만으로 만들어집니다 — 예: `refactor/42`
      placeholder: "dedup-hook-transport"
