name: 이슈 자동화

# 두 가지를 처리한다.
#
# 1) 담당자 자동 지정 — 이슈가 열리면 작성자를 담당자로 등록한다.
#    이슈를 올린 사람이 곧 맡을 사람인 경우가 대부분이라, 매번 손으로
#    "assign yourself"를 누르는 수고를 없앤다. 다른 사람이 맡게 되면
#    나중에 바꾸면 된다.
#
# 2) 작업 브랜치 생성 — 이슈에 `ready` 라벨이 붙으면 브랜치를 만든다.
#    이슈 생성이 아니라 라벨을 트리거로 쓰는 이유: 대부분의 이슈는 브랜치가
#    필요 없다. 질문, 중복, 논의만 하다 닫히는 이슈까지 브랜치를 만들면
#    빈 브랜치가 쌓인다. `ready`는 실제로 작업이 시작되는 시점을 뜻한다.
#
#    브랜치 이름: <타입>/<이슈번호>-<제목 슬러그>
#      예) 42번 이슈 "로그인 리다이렉트 루프" -> fix/42-로그인-리다이렉트-루프
#    타입 접두사는 이슈 라벨에서 가져오며, 이 저장소의 커밋 컨벤션
#    (feat/fix/refactor/perf/chore/docs)과 일치한다.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write        # 브랜치 ref 생성
  issues: write          # 담당자 지정, 댓글 작성

jobs:
  # ── 1) 작성자를 담당자로 자동 지정 ──────────────────────────────────
  assign-author:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: 작성자를 담당자로 지정
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;

            // 이미 담당자가 있으면 건드리지 않는다.
            if (issue.assignees && issue.assignees.length > 0) {
              core.info(`이미 담당자가 있습니다 (${issue.assignees.map(a => a.login).join(', ')}) — 건너뜁니다.`);
              return;
            }

            // 봇이 연 이슈는 대상이 아니다.
            if (issue.user.type === 'Bot' || author.endsWith('[bot]')) {
              core.info(`봇이 연 이슈입니다 (${author}) — 건너뜁니다.`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [author],
              });
              core.info(`#${issue.number} 담당자를 ${author} 로 지정했습니다.`);
            } catch (err) {
              // 저장소에 쓰기 권한이 없는 사람은 담당자로 지정할 수 없다.
              // 외부 기여자의 이슈가 여기 해당한다. 실패해도 워크플로를
              // 실패시키지 않는다 — 담당자 지정은 편의 기능일 뿐이다.
              core.warning(`${author}를 담당자로 지정하지 못했습니다: ${err.message}`);
            }

  # ── 2) `ready` 라벨이 붙으면 작업 브랜치 생성 ───────────────────────
  create-branch:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 생성 및 댓글
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name.toLowerCase());

            // 이슈 라벨에서 타입 접두사를 고른다. 먼저 일치하는 것이 이긴다.
            const typeByLabel = [
              ['bug',          'fix'],
              ['enhancement',  'feat'],
              ['feature',      'feat'],
              ['refactor',     'refactor'],
              ['performance',  'perf'],
              ['perf',         'perf'],
              ['documentation','docs'],
              ['docs',         'docs'],
              ['security',     'fix'],
              ['task',         'chore'],
              ['chore',        'chore'],
            ];
            const hit = typeByLabel.find(([label]) => labels.includes(label));
            const type = hit ? hit[1] : 'chore';

            // 브랜치 이름은 항상 영문이어야 한다.
            // 이슈 템플릿의 "브랜치 슬러그 (영문)" 입력란을 쓴다. 제목은 한글이므로
            // 슬러그화해봐야 의미가 사라진다 — 사람이 적은 영문을 그대로 살린다.
            const clean = (v) => (v ?? '')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 50)
              .replace(/-+$/g, '');

            // 폼 본문에서 해당 섹션을 찾는다. 다음 `###` 헤딩 전까지가 값이다.
            // 미입력 시 GitHub 이 넣는 `_No response_` 는 값이 아니다.
            const field = (issue.body ?? '')
              .match(/^###\s*브랜치 슬러그[^\n]*\n+([\s\S]*?)(?=\n###|$)/m)?.[1]
              ?.trim();
            const slug = field && field !== '_No response_' ? clean(field) : '';

            if (!slug) {
              core.info('브랜치 슬러그가 비어 있습니다 — 이슈 번호만 사용합니다.');
            }

            const branch = `${type}/${issue.number}${slug ? '-' + slug : ''}`;

            // 이미 있으면 아무것도 하지 않는다. 라벨을 다시 붙여도 실패하지 않도록.
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`${branch} 브랜치가 이미 있습니다 — 건너뜁니다.`);
              return;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            // 기본 브랜치의 현재 tip에서 분기한다.
            const base = context.payload.repository.default_branch;
            const baseRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${base}`,
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: baseRef.data.object.sha,
            });

            core.info(`${base}@${baseRef.data.object.sha.slice(0, 7)}에서 ${branch} 생성`);

            const body = [
              `\`${base}\`에서 [\`${branch}\`](${context.payload.repository.html_url}/tree/${encodeURIComponent(branch)}) 브랜치를 만들었습니다.`,
              '',
              '```bash',
              'git fetch origin',
              `git checkout ${branch}`,
              '```',
              '',
              `PR을 열 때 본문에 \`Closes #${issue.number}\`를 넣으면 머지와 함께 이 이슈가 닫힙니다.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
